services:
  # El Frontend (Vue)
  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend

  # El Backend (Laravel) - Tu compañero solo tendrá que poner su código aquí
  backend:
    image: php:8.2-fpm
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=db

  # La Base de Datos (MySQL)
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: proyecto_db
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: