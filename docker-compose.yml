services:
  # El teu frontend
  frontend:
    build: ./frontend
    restart: always
    networks:
      - app-network

  # El servei de Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./proxy/www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - app-network
    depends_on:
      - frontend

  # Certbot per obtenir el certificat
  certbot:
    image: certbot/certbot
    volumes:
      - ./proxy/www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
